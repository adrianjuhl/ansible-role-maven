---
# tasks file for adrianjuhl.maven

- name: "Log adrianjuhl__maven__maven_archive_file_checksum"
  ansible.builtin.debug:
    msg: "The value of adrianjuhl__maven__maven_archive_file_checksum is: {{ adrianjuhl__maven__maven_archive_file_checksum }}"

- name: "Create download directory"
  file:
    dest: "{{ adrianjuhl__maven__maven_download_directory }}"
    state: "directory"
    mode: "u=rwx,go=rx"

- name: "Download Maven"
  get_url:
    url: "{{ adrianjuhl__maven__maven_source_url_directory }}/{{ adrianjuhl__maven__maven_archive_file_name }}"
    dest: "{{ adrianjuhl__maven__maven_download_directory }}"
    checksum: "{{ adrianjuhl__maven__maven_archive_file_checksum }}"
    force: no
    mode: "u=rw,go=r"

- name: "Create maven install directory"
  file:
    dest: "{{ adrianjuhl__maven__maven_install_directory }}"
    state: "directory"

- name: "Unarchive maven"
  unarchive:
    src: "{{ adrianjuhl__maven__maven_download_directory }}/{{ adrianjuhl__maven__maven_archive_file_name }}"
    dest: "{{ adrianjuhl__maven__maven_install_directory }}"
    copy: false

- name: "Configure maven alternative"
  community.general.alternatives:
    name: "mvn"
    path: "{{ adrianjuhl__maven__maven_install_directory }}/apache-maven-{{ adrianjuhl__maven__maven_version }}/bin/mvn"
    link: "/usr/bin/mvn"
    priority: "{{ adrianjuhl__maven__maven_alternatives_priority }}"
    state: "{{ adrianjuhl__maven__maven_alternatives_state }}"

